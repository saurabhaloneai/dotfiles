theme = "gruvbox"

[editor]
line-number = "relative"
mouse = true
cursorline = true
auto-save = true
bufferline = "multiple"
color-modes = true
true-color = true
rulers = [80, 120]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true
character = "│"

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.statusline]
left = ["mode", "spinner", "file-name", "file-modification-indicator"]
center = []
right = ["diagnostics", "selections", "register", "position", "file-encoding", "file-line-ending", "file-type"]
separator = "│"

[editor.whitespace.render]
tab = "all"
newline = "none"

[editor.soft-wrap]
enable = true

[keys.normal]
C-s = ":w"
C-q = ":q"
space.e = ":sh zellij run -- broot"
space.f = "file_picker"
space.g = ":sh zellij run -- lazygit"
